name: spending_docs
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  path_provider: ^2.1.3
  drift: 2.34.0
  drift_flutter: 0.3.0
  equatable: 2.0.8
  google_mlkit_text_recognition: ^0.15.0 # OCR for Android and iOS
  flutter_tesseract_ocr: ^0.4.30          # For Windows and Linux
  image_picker: ^1.2.2
  llamadart: ^0.8.10
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: 10.0.0
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.4.9
  mocktail: 1.0.5

flutter:
  uses-material-design: true

assets:
  - assets/tessdata_config.json
  - assets/tessdata/eng.traineddata
  - assets/tessdata/ron.traineddata
